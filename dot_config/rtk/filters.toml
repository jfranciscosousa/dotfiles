# User-global RTK filters. Project-local .rtk/filters.toml takes precedence.
# Docs: https://github.com/rtk-ai/rtk#custom-filters
# On macOS rtk reads ~/Library/Application Support/rtk/filters.toml, which
# chezmoi links to this file. rtk ignores the file until `rtk trust` records
# its hash, so run `rtk trust` again after each change.
schema_version = 1

# The hook never routes plain `pnpm ...` to a TOML filter because `pnpm` is a
# native rtk subcommand. The `mise exec --` wrapper makes the hook route it.
# Strip known noise only, so unknown errors (module resolution, TypeScript,
# real console.error output) survive.
[filters.dragon-jest]
description = "Compact Jest output from pnpm --filter @remote-com/* test scripts"
match_command = "^mise exec --\\s+pnpm\\s+(--filter[ =]|-F\\s*)@remote-com/\\S+\\s+(run\\s+)?test(:file)?(\\s|$)"
strip_ansi = true
filter_stderr = true
replace = [{ pattern = " \\(\\d+ MB heap size\\)", replacement = "" }]
strip_lines_matching = [
  "^\\s*$",
  # pnpm script echo, norma cn-table build, Dragon test setup
  "^\\$ ",
  "^cn tables are current$",
  "^Finished in \\d+m?s on \\d+ files? using \\d+ threads\\.$",
  "^generated src/utils/cn-tables\\.generated\\.ts$",
  "^Skipping setup\\.\\.\\.$",
  "^Running one project: ",
  # jest-haste-map duplicate manual mock warning
  "^jest-haste-map: duplicate manual mock found: ",
  "^\\s+The following files share their name; please delete one of them:$",
  "^\\s+\\* <rootDir>/.*/__mocks__/",
  # jsdom "Could not parse CSS stylesheet" dump of the whole Tailwind CSS
  "^\\s+Error: Could not parse CSS stylesheet$",
  "^\\s+detail: '/\\*! tailwindcss ",
  "^\\s+'.*\\\\n' \\+$",
  "^\\s+' '\\.\\.\\. \\d+ more characters,$",
  "^\\s+type: 'css parsing'$",
  "^\\s+\\d+ \\|   style\\.(id = STYLE_ELEMENT_ID|textContent = css);$",
  "^\\s+> \\d+ \\|   doc\\.head\\.appendChild\\(style\\);$",
  "^\\s+at appendChild \\(.*/norma/src/test-utils/jsdom\\.ts:",
  "^\\s+at Object\\.<anonymous> \\(setupTests\\.js:",
  "^\\s+at .*/node_modules/",
  # passing tests and reporters
  "^\\s+✓ ",
  "^FlakyTestsReporter ",
  "^No flaky tests found$",
  "^Ran all test suites",
  # pnpm failure box; the exit code is preserved
  "^\\[ELIFECYCLE\\] Test failed\\. See above for more details\\.$",
  "^Error: ERR_PNPM_RECURSIVE_RUN_FIRST_FAIL$",
  "^\\s+× \"pnpm recursive run\" failed in ",
  "^\\s+│ ",
]

