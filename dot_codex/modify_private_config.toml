{{- /* chezmoi:modify-template */ -}}
{{- $existing := dict -}}
{{- if hasKey .chezmoi "stdin" -}}
{{- $existing = index .chezmoi "stdin" | fromToml -}}
{{- end -}}
{{- $_ := set $existing "model" "gpt-6.1-sol" -}}
{{- $features := index $existing "features" | default dict -}}
{{- $_ := set $features "hooks" true -}}
{{- $_ := set $features "plugin_hooks" true -}}
{{- $_ := set $existing "features" $features -}}

{{- if hasPrefix "Remote-" .chezmoi.hostname -}}
{{- $mcpServers := dict
  "linear" (dict "url" "https://mcp.linear.app/mcp")
  "slack" (dict "url" "https://mcp.slack.com/mcp")
-}}
{{- $_ := set $existing "mcp_servers" $mcpServers -}}
{{- end -}}

{{ $existing | toToml }}
